<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow,noarchive" />
<meta name="referrer" content="no-referrer" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://vztdhteljfmgrbpwilik.supabase.co; img-src data:; base-uri 'none'; form-action 'none'" />
<title>ENCAESES · Complementação de dados</title>
<style>
:root{color-scheme:light;--ink:#183b48;--muted:#657980;--line:#dce6e8;--blue:#1e6370;--soft:#eef5f4;--white:#fff;--red:#ad473a}
*{box-sizing:border-box}body{margin:0;background:#f6f8f8;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.45}
main{max-width:930px;margin:auto;padding:26px 16px 80px}.brand{display:flex;align-items:center;gap:12px;padding:6px 2px 22px}.brandmark{width:40px;height:40px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}.brand b{font-size:15px;letter-spacing:.035em}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.panel{border:1px solid var(--line);border-radius:18px;background:white;padding:30px;box-shadow:0 9px 36px #20435008}h1{font-size:clamp(22px,4.5vw,30px);margin:0 0 6px;letter-spacing:-.02em;line-height:1.2}h2{font-size:16px;margin:24px 0 12px}.subtitle{color:var(--muted);margin:0 0 24px;font-size:14px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:var(--blue);font-weight:800;font-size:11px;margin:0 0 10px}
.summary{background:var(--soft);border-radius:12px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}.summary p{margin:0}.summary strong,.summary span{display:block}.summary strong{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:3px}.summary span{font-size:14px;overflow-wrap:anywhere}.full{grid-column:1/-1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field.wide{grid-column:1/-1}label,.lbl{font-weight:700;font-size:13px}label small{font-weight:400;color:var(--muted)}input,textarea,select{font:inherit;width:100%;border:1px solid #cbd9dc;border-radius:9px;background:#fff;color:var(--ink);padding:10px 12px;min-height:42px;outline-offset:2px}textarea{min-height:78px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #17637419;outline:0}.help{color:var(--muted);font-size:12px;margin:0}.check{display:flex;gap:8px;align-items:flex-start;line-height:1.3;font-size:13px;font-weight:500}.check input{min-height:0;width:17px;height:17px;margin-top:1px;flex:none}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}.btn{background:var(--ink);color:white;border:0;padding:12px 22px;border-radius:9px;font-weight:700;cursor:pointer;font-size:14px}.btn:hover{filter:brightness(1.12)}.btn:disabled{opacity:.45;cursor:progress}.btn.alt{background:var(--soft);color:var(--ink)}.btn.sm{padding:7px 11px;font-size:12px}.ok{padding:16px;border-radius:12px;background:var(--soft);border:1px solid #c6ddda;margin-top:18px}.bad{padding:14px;border-radius:10px;color:var(--red);background:#fff4f1;border:1px solid #f0d6d1;margin:16px 0}.note{font-size:12px;color:var(--muted);margin:16px 2px 0}.hint{font-size:12px;color:var(--muted);margin:3px 0 0}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.stats{display:flex;gap:13px;flex-wrap:wrap;margin:17px 0}.stat{flex:1;min-width:120px;border-radius:12px;background:var(--soft);padding:15px}.stat b{display:block;font-size:26px}.stat small{color:var(--muted)}.people{display:grid;gap:10px}.person{border:1px solid var(--line);border-radius:12px;padding:16px}.personhead{display:flex;justify-content:space-between;gap:12px;align-items:center}.personhead strong{display:block}.personhead small{display:block;color:var(--muted);margin-top:3px}.tag{padding:5px 9px;font-size:11px;border-radius:20px;background:#eaf1f4;white-space:nowrap}.tag.done{background:#e0f0e8;color:#235b4b}.tag.checked{background:#dcf0e8;color:#175646}.detail{margin-top:15px;border-top:1px solid var(--line);padding-top:15px}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px 16px}.detailgrid p{margin:0;font-size:13px;overflow-wrap:anywhere}.detailgrid b{display:block;color:var(--muted);font-size:11px}.footer{color:#7b8a8d;text-align:center;font-size:11px;margin-top:24px}
@media(max-width:640px){main{padding:18px 10px 55px}.panel{padding:19px 16px;border-radius:13px}.grid,.summary,.detailgrid{grid-template-columns:1fr}.full,.field.wide{grid-column:auto}.summary{gap:9px}.personhead{align-items:flex-start}.brand{padding-bottom:15px}}
</style>
</head>
<body>
<main>
<header class="brand"><div class="brandmark">E</div><div><b>ENCAESES 2026</b><small>Prestação de contas · Projeto Transforma-ações</small></div></header>
<section class="panel" id="app"><h1>Carregando...</h1></section>
<div class="footer">Dados coletados apenas para conferência da coordenação. Não é recibo oficial da FAPEMAT.</div>
</main>
<script>
'use strict';
const ENDPOINT='https://vztdhteljfmgrbpwilik.supabase.co/functions/v1/encaeses-2026-dados';
const app=document.getElementById('app');
const qs=new URLSearchParams(location.hash.slice(1));
const access=qs.get('p')||'',adminKey=qs.get('admin')||'';
const isAdmin=!!adminKey;
let rows=[];
function escapeText(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(c){return (Number(c||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function formatDate(d){if(!d)return '—';const a=d.slice(0,10).split('-');return a.length===3?a.reverse().join('/'):d;}
async function api(action,token,data={}){
 const r=await fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json'},cache:'no-store',body:JSON.stringify({action,token,...data})});
 let j;try{j=await r.json();}catch{throw Error('Não foi possível ler a resposta do servidor.');}
 if(!r.ok||!j.ok)throw Error(j.error||'Falha de comunicação.');return j;
}
function error(err){app.innerHTML='<h1>Não foi possível abrir</h1><div class="bad"></div><p class="help">Confira o link que recebeu da coordenação.</p>';app.querySelector('.bad').textContent=err.message||String(err);}
function summaryRow(l,v){return '<p><strong>'+escapeText(l)+'</strong><span>'+escapeText(v||'—')+'</span></p>';}
function inp(id,label,value='',type='text',wide=false,placeholder='') {return '<div class="field '+(wide?'wide':'')+'"><label for="'+id+'">'+label+'</label><input id="'+id+'" name="'+id+'" type="'+type+'" value="'+escapeText(value||'')+'" placeholder="'+escapeText(placeholder)+'" '+(type==='date'?'':'autocomplete="off"')+'></div>';}
function value(id){return (document.getElementById(id)?.value||'').trim();}
function renderPerson(p){
 const sent=!!p.submitted_at;
 app.innerHTML='<div class="eyebrow">Ficha individual · acesso reservado</div><h1>Confira e complete seus dados</h1><p class="subtitle">Para cadastro do Recibo de Colaborador Eventual da FAPEMAT. Leva poucos minutos.</p>'+
 '<div class="summary">'+summaryRow('Nome',p.full_name)+summaryRow('CPF',p.cpf)+summaryRow('E-mail',p.email)+summaryRow('Valor informado pela coordenação',money(p.amount_cents))+summaryRow('Endereço já informado',p.address_informed)+'</div>'+
 (p.original_note?'<p class="hint">Confira o endereço: '+escapeText(p.original_note)+'</p>':'')+
 (sent?'<div class="ok">Sua resposta foi recebida em '+escapeText(new Date(p.submitted_at).toLocaleString('pt-BR'))+'. Você pode atualizar os dados abaixo e reenviar.</div>':'')+
 '<form id="dados" autocomplete="on"><h2>Dados que faltam</h2><div class="grid">'+
 inp('profession','Profissão / função *',p.profession,'text',true,'Ex.: professora, artesã, pesquisadora')+
 inp('rg','Número do RG *',p.rg)+inp('issuer','Órgão emissor *',p.issuer,'text',false,'Ex.: SESP/MT')+
 inp('rg_date','Data de emissão do RG *',p.rg_date,'date')+
 '<div class="field"><label for="pis_nit">PIS / PASEP / NIT *</label><input id="pis_nit" name="pis_nit" inputmode="numeric" value="'+escapeText(p.pis_nit)+'" placeholder="Número sem espaços"><label class="check"><input id="pis_none" type="checkbox" '+(p.pis_none?'checked':'')+'>Não possuo ou não tenho esse número no momento</label></div>'+
 inp('address_confirmed','Endereço completo conferido *',p.address_confirmed||p.address_informed,'text',true,'Rua/localidade, número ou s/n, bairro, cidade e UF')+
 inp('cep','CEP (se souber)',p.cep,'text',false,'00000-000')+
 '<div class="field"><label for="start_date">Primeiro dia de atividade *</label><input type="date" id="start_date" value="'+escapeText(p.start_date||'')+'" min="2026-10-27" max="2026-10-31"></div>'+
 '<div class="field"><label for="end_date">Último dia de atividade *</label><input type="date" id="end_date" value="'+escapeText(p.end_date||'')+'" min="2026-10-27" max="2026-10-31"></div>'+
 '<div class="field wide"><label for="activity_type">Como participou do ENCAESES? *</label><select id="activity_type"><option value="">Selecione</option>'+['Palestra','Mesa/debate','Discussões','Palestra e debates','Outra atividade'].map(t=>'<option value="'+escapeText(t)+'" '+(p.activity_type===t?'selected':'')+'>'+escapeText(t)+'</option>').join('')+'</select></div>'+
 inp('activity_title','Tema da palestra / atividade (se aplicável)',p.activity_title,'text',true)+
 '<div class="field wide"><label for="note">Observação (opcional)</label><textarea id="note" maxlength="500" placeholder="Algo que a coordenação precisa saber">'+escapeText(p.note||'')+'</textarea></div></div>'+
 '<div class="actions"><label class="check"><input id="self_confirmed" type="checkbox" '+(p.self_confirmed?'checked':'')+'>Confirmo que conferi os dados e informei os dias em que efetivamente atuei.</label></div>'+
 '<div id="feedback" role="status" aria-live="polite"></div><div class="actions"><button type="submit" class="btn" id="send">Enviar à coordenação</button></div></form>'+
 '<p class="note">Este cadastro não é uma assinatura ou declaração de recebimento. O recibo oficial será emitido posteriormente no SIGFAPEMAT.</p>';
 const f=document.getElementById('dados');const c=document.getElementById('pis_none'),pinput=document.getElementById('pis_nit');
 function toggle(){pinput.disabled=c.checked;if(c.checked)pinput.value='';}c.addEventListener('change',toggle);toggle();
 f.addEventListener('submit',async(ev)=>{
 ev.preventDefault();const b=document.getElementById('send'),feedback=document.getElementById('feedback');feedback.innerHTML='';
 const data={profession:value('profession'),rg:value('rg'),issuer:value('issuer'),rg_date:value('rg_date'),pis_nit:value('pis_nit'),pis_none:c.checked,address_confirmed:value('address_confirmed'),cep:value('cep'),start_date:value('start_date'),end_date:value('end_date'),activity_type:value('activity_type'),activity_title:value('activity_title'),note:value('note'),self_confirmed:document.getElementById('self_confirmed').checked};
 b.disabled=true;b.textContent='Enviando...';
 try {const result=await api('send',access,{fields:data});f.reset();app.innerHTML='<div class="eyebrow">ENCAESES 2026</div><h1>Informações enviadas!</h1><div class="ok">'+escapeText(result.message)+'</div><p>Se precisar corrigir algo, abra novamente seu mesmo link.</p><button class="btn alt" onclick="location.reload()">Reabrir formulário</button>';window.scrollTo(0,0)}
 catch(err){feedback.className='bad';feedback.textContent=err.message;b.disabled=false;b.textContent='Enviar à coordenação';}
 });
}
const displayOrder=['full_name','cpf','email','profession','rg','issuer','rg_date','pis_nit','pis_none','address_informed','address_confirmed','cep','start_date','end_date','activity_type','activity_title','note','amount_cents','submitted_at','reviewed_at','review_note'];
const displayNames=['Nome','CPF','E-mail','Profissão/função','RG','Órgão emissor','Emissão do RG','PIS/PASEP/NIT','PIS indisponível','Endereço original','Endereço conferido','CEP','Início de atuação','Fim de atuação','Atuação','Tema','Observação','Valor informado','Enviado em','Conferido em','Observação da coordenação'];
function fieldShown(x,k){const v=x[k];return k==='amount_cents'?money(v):k==='pis_none'?(v?'Sim':'Não'):k.endsWith('_date')||k==='start_date'||k==='end_date'?formatDate(v):k==='submitted_at'||k==='reviewed_at'?(v?new Date(v).toLocaleString('pt-BR'):'—'):String(v??'—');}
function csv(){const heads=displayNames;const data=[heads,...rows.map(x=>displayOrder.map(k=>fieldShown(x,k)))];const txt='\ufeff'+data.map(row=>row.map(v=>{let s=String(v??'');if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';}).join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='encaeses_2026_dados_fapemat.csv';document.body.append(a);a.click();a.remove();URL.revokeObjectURL(url);}
function renderAdmin(){
 const done=rows.filter(r=>r.submitted_at).length,reviewed=rows.filter(r=>r.reviewed_at).length;
 app.innerHTML='<div class="topline"><div><div class="eyebrow">Acesso reservado à coordenação</div><h1>Conferência dos dados</h1></div><button class="btn alt sm" id="reload">Atualizar</button></div><p class="subtitle">IX ENCAESES · 10 participantes cadastrados · valores sujeitos à conferência documental</p>'+
 '<div class="stats"><div class="stat"><b>'+rows.length+'</b><small>Convidados</small></div><div class="stat"><b>'+done+'</b><small>Responderam</small></div><div class="stat"><b>'+reviewed+'</b><small>Conferidos</small></div></div><div class="actions"><button class="btn" id="csv">Exportar CSV</button><button class="btn alt" id="hide">Sair</button></div><h2>Participantes</h2><div class="people" id="people"></div><p class="note">Links individuais são confidenciais. Este painel só funciona com o acesso privado da coordenação. Jairo está excluído (R$ 1.350 ainda não pago). Os valores exibidos são informativos, não comprovantes de quitação.</p>';
 document.getElementById('reload').addEventListener('click',loadAdmin);document.getElementById('csv').addEventListener('click',csv);document.getElementById('hide').addEventListener('click',()=>{location.hash='';location.reload();});
 const container=document.getElementById('people');
 for(const p of rows){const submitted=!!p.submitted_at,reviewed=!!p.reviewed_at;const d=document.createElement('div');d.className='person';
  const h='<div class="personhead"><div><strong>'+escapeText(p.full_name)+'</strong><small>'+escapeText(money(p.amount_cents))+' · '+(submitted?'Resposta em '+escapeText(formatDate(p.submitted_at)):'Aguardando dados')+'</small></div><span class="tag '+(reviewed?'checked':submitted?'done':'')+'">'+(reviewed?'Conferido':submitted?'Recebido':'Pendente')+'</span></div>';
  d.innerHTML=h+'<div class="actions"><button class="btn alt sm detailbtn">'+(submitted?'Ver dados':'Ver cadastro')+'</button></div><div class="detail" hidden><div class="detailgrid">'+displayOrder.map((k,i)=>'<p><b>'+escapeText(displayNames[i])+'</b>'+escapeText(fieldShown(p,k))+'</p>').join('')+'</div><div class="actions"><button class="btn sm reviewbtn" '+(!submitted?'disabled':'')+'>'+(reviewed?'Desmarcar conferência':'Marcar como conferido')+'</button></div><div id="state"></div></div>';
  d.querySelector('.detailbtn').addEventListener('click',()=>{const el=d.querySelector('.detail');el.hidden=!el.hidden;});
  d.querySelector('.reviewbtn').addEventListener('click',async(ev)=>{const btn=ev.currentTarget;btn.disabled=true;try{await api('review',adminKey,{id:p.id,reviewed:!p.reviewed_at});await loadAdmin();}catch(err){d.querySelector('#state').textContent=err.message;btn.disabled=false;}});container.append(d);
 }
}
async function loadAdmin(){app.innerHTML='<h1>Abrindo painel privado...</h1>';try{const r=await api('dashboard',adminKey);rows=r.rows;renderAdmin();}catch(err){error(err);}}
async function start(){if(access){try{const r=await api('get',access);renderPerson(r.person);}catch(err){error(err);}}else if(isAdmin){await loadAdmin();}else{app.innerHTML='<div class="eyebrow">ENCAESES 2026</div><h1>Complementação de dados</h1><p class="subtitle">Este formulário é acessado pelo link individual enviado pela coordenação do evento.</p><p>Se você recebeu um convite, abra o link completo recebido em mensagem privada.</p><p class="note">Por segurança, esta página não apresenta a lista pública de participantes.</p>';}}
start();
</script>
</body></html>
